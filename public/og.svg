<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#F5EFDF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 책 일러스트 -->
  <g transform="translate(80, 130)">
    <rect width="200" height="180" rx="6" fill="#8B6F47"/>
    <rect x="14" y="14" width="172" height="152" rx="2" fill="#FAF7F0"/>
    <line x1="100" y1="14" x2="100" y2="166" stroke="#8B6F47" stroke-width="1"/>
    <line x1="28" y1="42" x2="86" y2="42" stroke="#8B6F47" stroke-width="1.5"/>
    <line x1="28" y1="62" x2="86" y2="62" stroke="#8B6F47" stroke-width="1.5"/>
    <line x1="28" y1="82" x2="78" y2="82" stroke="#8B6F47" stroke-width="1.5"/>
    <line x1="114" y1="42" x2="172" y2="42" stroke="#8B6F47" stroke-width="1.5"/>
    <line x1="114" y1="62" x2="172" y2="62" stroke="#8B6F47" stroke-width="1.5"/>
    <line x1="114" y1="82" x2="164" y2="82" stroke="#8B6F47" stroke-width="1.5"/>
  </g>

  <!-- 메인 타이틀 -->
  <text x="320" y="200" font-family="'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif" font-size="72" font-weight="800" fill="#2A2520">책점</text>
  <text x="320" y="265" font-family="'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif" font-size="32" font-weight="500" fill="#6B5E4E">책님이 답해드립니다</text>

  <!-- 부제 -->
  <text x="80" y="430" font-family="'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif" font-size="42" font-weight="700" fill="#2A2520">마음에 질문을 담고,</text>
  <text x="80" y="490" font-family="'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif" font-size="42" font-weight="700" fill="#8B6F47">책을 펼쳐보세요</text>

  <text x="80" y="560" font-family="'Apple SD Gothic Neo', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif" font-size="24" font-weight="500" fill="#6B5E4E">한 번의 클릭으로 받는 책님의 한 마디</text>
</svg>
